<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hostel Complaint Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🏠 Hostel Complaint Management System</h1>
    <p>Submit and track your hostel complaints</p>
</header>

<div class="container">

    <div class="card">

        <h2>Submit a Complaint</h2>

        <form onsubmit="submitComplaint(event)">

            <label>Student Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label>Roll Number</label>
            <input
                type="text"
                id="roll"
                placeholder="Enter roll number"
                required
            >

            <label>Room Number</label>
            <input
                type="text"
                id="room"
                placeholder="Enter room number"
                required
            >

            <label>Complaint Category</label>

            <select id="category" required>
                <option value="">Select category</option>
                <option>Electricity</option>
                <option>Water</option>
                <option>Cleaning</option>
                <option>Food</option>
                <option>Wi-Fi</option>
                <option>Other</option>
            </select>

            <label>Complaint Description</label>

            <textarea
                id="complaint"
                placeholder="Describe your complaint..."
                required
            ></textarea>

            <button type="submit">
                Submit Complaint
            </button>

        </form>

        <div id="result" style="display:none;"></div>

    </div>

</div>

<footer>
    © 2026 Hostel Complaint Management System
</footer>

<script src="script.js"></script>

</body>
</html>
